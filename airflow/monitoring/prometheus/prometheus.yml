global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: walmart-streaming-flow
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: walmart-exporter
    static_configs:
      - targets: [walmart-exporter:9105]

  - job_name: airflow-postgres
    static_configs:
      - targets: [airflow-postgres-exporter:9187]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://airflow-apiserver:8080/api/v2/monitor/health
        labels:
          service: airflow-api
      - targets:
          - http://airflow-scheduler:8974/health
        labels:
          service: airflow-scheduler
      - targets:
          - http://grafana:3000/api/health
        labels:
          service: grafana
      - targets:
          - http://loki:3100/ready
        labels:
          service: loki
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: walmart-generator
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/runtime/generator-targets*.json
        refresh_interval: 5s
