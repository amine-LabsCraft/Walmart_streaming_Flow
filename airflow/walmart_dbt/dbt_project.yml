name: "walmart_dbt"
version: "1.0.0"
profile: "walmart_dbt"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  walmart_dbt:
    silver_t:
      +materialized: incremental
      +schema: silver_t
    silver_b:
      +materialized: table
      +schema: silver_b
    gold:
      +materialized: table
      +schema: gold
      ephemeral:
        +materialized: ephemeral

snapshots:
  walmart_dbt:
    +database: walmart
    +schema: gold
    +strategy: timestamp
    # Current versions get an open-ended validity date instead of NULL.
    +dbt_valid_to_current: "to_date('9999-12-31')"
