version: 2

# SCD2 history (audit trail), stored in the walmart.snapshots schema.
# The star schema reads their current version through models/gold/dim.
# Shared settings (strategy, open-ended validity) live in dbt_project.yml.

snapshots:

  - name: customers_snapshot
    description: Historique SCD2 des clients.
    relation: ref('eph_customers')
    config:
      unique_key: customer_id
      updated_at: customer_updated_timestamp

  - name: employees_snapshot
    description: Historique SCD2 des employés (poste, salaire, magasin).
    relation: ref('eph_employees')
    config:
      unique_key: employee_id
      updated_at: employee_updated_timestamp

  - name: products_snapshot
    description: Historique SCD2 des produits, dont l'évolution des prix.
    relation: ref('eph_products')
    config:
      unique_key: product_id
      updated_at: product_updated_timestamp

  - name: stores_snapshot
    description: Historique SCD2 des magasins.
    relation: ref('eph_stores')
    config:
      unique_key: store_id
      updated_at: store_updated_timestamp

  - name: orders_snapshot
    description: >-
      Historique du cycle de vie des commandes (Pending, Completed,
      Cancelled, Returned). Table d'audit, pas une dimension.
    relation: ref('eph_orders')
    config:
      unique_key: order_id
      updated_at: order_updated_timestamp
