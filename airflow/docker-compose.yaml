# Local development configuration.

---

x-airflow-common:
  &airflow-common

  image: walmart-airflow:3.2.2

  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - ${ENV_FILE_PATH:-.env}

  environment:
    &airflow-common-env

    # ==========================================================
    # Airflow Core
    # ==========================================================

    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__CORE__AUTH_MANAGER: >-
      airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: >-
      http://airflow-apiserver:8080/execution/

    # ==========================================================
    # Airflow Database
    # ==========================================================

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:airflow@postgres/airflow

    # ==========================================================
    # Celery
    # ==========================================================

    AIRFLOW__CELERY__RESULT_BACKEND: >-
      db+postgresql://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # ==========================================================
    # Airflow API
    # ==========================================================

    AIRFLOW__API_AUTH__JWT_SECRET: >-
      ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}

    AIRFLOW__API_AUTH__JWT_ISSUER: >-
      ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}

    # ==========================================================
    # Scheduler
    # ==========================================================

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    # ==========================================================
    # Configuration
    # ==========================================================

    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg

    _PIP_ADDITIONAL_REQUIREMENTS: ""

    # ==========================================================
    # Databricks
    # ==========================================================

    DATABRICKS_HOST: ${DATABRICKS_HOST}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
    DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH}

    # ==========================================================
    # dbt
    # ==========================================================

    DBT_TARGET: ${DBT_TARGET:-dev}
    DBT_CATALOG: ${DBT_CATALOG:-walmart}
    DBT_SCHEMA: ${DBT_SCHEMA:-dbt_schema}
    DBT_THREADS: ${DBT_THREADS:-1}

    # ==========================================================
    # Local Walmart source (replaces Ghost PostgreSQL)
    # ==========================================================

    WALMART_SOURCE_DB_URL: >-
      postgresql://walmart:walmart@walmart-source-db:5432/walmart
    WALMART_BRONZE_SCHEMA: ${WALMART_BRONZE_SCHEMA:-bronze_local}

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/walmart_dbt:/opt/airflow/walmart_dbt

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on

    redis:
      condition: service_healthy

    postgres:
      condition: service_healthy


services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - airflow
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: always

  # ============================================================
  # Walmart source PostgreSQL (local replacement for Ghost)
  # ============================================================

  walmart-source-db:
    image: postgres:16

    environment:
      POSTGRES_USER: walmart
      POSTGRES_PASSWORD: walmart
      POSTGRES_DB: walmart

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - walmart-source-db-volume:/var/lib/postgresql/data
      - "../Walmart Data Engineering/Walmart dataset:/seed:ro"
      - "../Walmart Data Engineering/Walmart dataset/docker-init:/docker-entrypoint-initdb.d:ro"

    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - walmart
        - -d
        - walmart
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: always

  # ============================================================
  # Redis
  # ============================================================

  redis:
    image: redis:7.2-bookworm

    expose:
      - "6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

    restart: always

  # ============================================================
  # Initialisation Airflow
  # ============================================================

  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        set -e

        echo "Creation des repertoires Airflow..."

        mkdir -p /opt/airflow/dags
        mkdir -p /opt/airflow/logs
        mkdir -p /opt/airflow/plugins
        mkdir -p /opt/airflow/config
        mkdir -p /opt/airflow/walmart_dbt

        echo "Version Airflow :"
        /entrypoint airflow version

        echo "Creation de la configuration Airflow..."
        /entrypoint airflow config list >/dev/null

        echo "Initialisation de la base de donnees..."
        /entrypoint airflow db migrate

        echo "Modification des permissions..."
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow

        echo "Initialisation Airflow terminee."

    environment:
      <<: *airflow-common-env

      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"

      _AIRFLOW_WWW_USER_USERNAME: >-
        ${_AIRFLOW_WWW_USER_USERNAME:-airflow}

      _AIRFLOW_WWW_USER_PASSWORD: >-
        ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

      _PIP_ADDITIONAL_REQUIREMENTS: ""

    user: "0:0"

  # ============================================================
  # Airflow API Server
  # ============================================================

  airflow-apiserver:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/monitor/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully

  # ============================================================
  # Airflow Scheduler
  # ============================================================

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8974/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully

  # ============================================================
  # Airflow DAG Processor
  # ============================================================

  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully

  # ============================================================
  # Airflow Celery Worker
  # ============================================================

  airflow-worker:
    <<: *airflow-common

    command: celery worker

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery
          --app airflow.providers.celery.executors.celery_executor.app
          inspect ping -d "celery@$${HOSTNAME}"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"

    # On `docker compose up` / `stop`, let the running task finish
    # (Celery warm shutdown) instead of killing it after 10 seconds.
    stop_grace_period: 15m

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  walmart-source-db-volume:
