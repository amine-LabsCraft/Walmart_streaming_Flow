<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 16px; fill: #475569; }
      .task { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .cmd { font-size: 13px; fill: #334155; font-family: Consolas, 'Courier New', monospace; }
      .note { font-size: 13px; fill: #475569; }
      .step { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1600" height="520" fill="#ffffff"/>

  <text x="40" y="50" class="title">DAG Airflow « orchestrate »</text>
  <text x="40" y="78" class="subtitle">Planifié @hourly · catchup désactivé · chaque tâche ne démarre qu'après le succès de la précédente</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="110" width="270" height="110" rx="12" fill="#e0f2fe" stroke="#017cee" stroke-width="2"/>
    <circle cx="68" cy="138" r="14" fill="#017cee"/><text x="68" y="143" text-anchor="middle" class="step">1</text>
    <text x="92" y="144" class="task">ingest_cdc</text>
    <text x="58" y="174" class="cmd">PostgreSQL local →</text>
    <text x="58" y="194" class="cmd">walmart.bronze_local</text>

    <rect x="350" y="110" width="270" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="378" cy="138" r="14" fill="#64748b"/><text x="378" y="143" text-anchor="middle" class="step">2</text>
    <text x="402" y="144" class="task">clean_target</text>
    <text x="368" y="174" class="cmd">rm -rf target logs</text>

    <rect x="660" y="110" width="270" height="110" rx="12" fill="#fff7ed" stroke="#ff694b" stroke-width="2"/>
    <circle cx="688" cy="138" r="14" fill="#ff694b"/><text x="688" y="143" text-anchor="middle" class="step">3</text>
    <text x="712" y="144" class="task">source_freshness</text>
    <text x="678" y="174" class="cmd">dbt source freshness</text>
    <text x="678" y="196" class="note">alerte si orders &gt; 2 h</text>

    <rect x="970" y="110" width="270" height="110" rx="12" fill="#fff7ed" stroke="#ff694b" stroke-width="2"/>
    <circle cx="998" cy="138" r="14" fill="#ff694b"/><text x="998" y="143" text-anchor="middle" class="step">4</text>
    <text x="1022" y="144" class="task">silver_technical</text>
    <text x="988" y="174" class="cmd">dbt run --select silver_t</text>
    <text x="988" y="196" class="note">6 modèles incrémentaux</text>

    <rect x="1280" y="110" width="280" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="1308" cy="138" r="14" fill="#059669"/><text x="1308" y="143" text-anchor="middle" class="step">5</text>
    <text x="1332" y="144" class="task">silver_technical_tests</text>
    <text x="1298" y="174" class="cmd">dbt test --select silver_t</text>
    <text x="1298" y="196" class="note">clés, relations, cohérences</text>
  </g>
  <line x1="310" y1="165" x2="346" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="165" x2="656" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="165" x2="966" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1240" y1="165" x2="1276" y2="165" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1420,220 V265 H175 V306" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <g>
    <rect x="40" y="310" width="270" height="110" rx="12" fill="#fff7ed" stroke="#ff694b" stroke-width="2"/>
    <circle cx="68" cy="338" r="14" fill="#ff694b"/><text x="68" y="343" text-anchor="middle" class="step">6</text>
    <text x="92" y="344" class="task">silver_business</text>
    <text x="58" y="374" class="cmd">dbt run --select silver_b</text>
    <text x="58" y="396" class="note">obt_b (table)</text>

    <rect x="350" y="310" width="270" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="378" cy="338" r="14" fill="#059669"/><text x="378" y="343" text-anchor="middle" class="step">7</text>
    <text x="402" y="344" class="task">silver_business_tests</text>
    <text x="368" y="374" class="cmd">dbt test --select silver_b</text>
    <text x="368" y="396" class="note">grain order_item_id</text>

    <rect x="660" y="310" width="270" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="688" cy="338" r="14" fill="#d97706"/><text x="688" y="343" text-anchor="middle" class="step">8</text>
    <text x="712" y="344" class="task">gold_dimensions</text>
    <text x="678" y="374" class="cmd">dbt snapshot</text>
    <text x="678" y="396" class="note">5 dimensions SCD2</text>

    <rect x="970" y="310" width="270" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="998" cy="338" r="14" fill="#d97706"/><text x="998" y="343" text-anchor="middle" class="step">9</text>
    <text x="1022" y="344" class="task">gold_facts</text>
    <text x="988" y="374" class="cmd">dbt run --select</text>
    <text x="988" y="394" class="cmd">path:models/gold/fact</text>

    <rect x="1280" y="310" width="280" height="110" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="1308" cy="338" r="15" fill="#059669"/><text x="1308" y="343" text-anchor="middle" class="step">10</text>
    <text x="1332" y="344" class="task">gold_facts_tests</text>
    <text x="1298" y="374" class="cmd">dbt test --select</text>
    <text x="1298" y="394" class="cmd">path:models/gold/fact</text>
  </g>
  <line x1="310" y1="365" x2="346" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="365" x2="656" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="365" x2="966" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1240" y1="365" x2="1276" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g>
    <rect x="40" y="455" width="18" height="18" rx="4" fill="#e0f2fe" stroke="#017cee"/><text x="66" y="469" class="note">ingestion Python</text>
    <rect x="210" y="455" width="18" height="18" rx="4" fill="#fff7ed" stroke="#ff694b"/><text x="236" y="469" class="note">construction dbt</text>
    <rect x="380" y="455" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#059669"/><text x="406" y="469" class="note">tests dbt (bloquants)</text>
    <rect x="570" y="455" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="596" y="469" class="note">couche Gold</text>
    <rect x="720" y="455" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#64748b"/><text x="746" y="469" class="note">maintenance</text>
    <text x="900" y="469" class="note">Les modèles éphémères gold/ephemeral sont compilés dans les snapshots (étape 8).</text>
  </g>
</svg>
